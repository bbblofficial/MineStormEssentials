name: MineStormEssentials
version: 1.0
main: org.minestorm.essentials.spigot.MineStormSpigot
author: Muvixo
description: Lightweight essentials plugin for Minecraft 1.8.8 (Spigot/Paper)
api-version: 1.8

commands:
  gmc:
    description: Set gamemode to Creative
    usage: /gmc [player]
    permission: minestorm.gamemode
  gms:
    description: Set gamemode to Survival
    usage: /gms [player]
    permission: minestorm.gamemode
  gmsp:
    description: Set gamemode to Spectator
    usage: /gmsp [player]
    permission: minestorm.gamemode
  gma:
    description: Set gamemode to Adventure
    usage: /gma [player]
    permission: minestorm.gamemode
  fly:
    description: Toggle flight
    usage: /fly [player]
    permission: minestorm.fly
  flyspeed:
    description: Set fly speed
    usage: /flyspeed <1-10> [player]
    permission: minestorm.flyspeed
    aliases: [ fspeed, fs ]
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases: [ tell, whisper, w, m, pm ]
    permission: minestorm.msg
  reply:
    description: Reply to last message
    usage: /reply <message>
    aliases: [ r ]
    permission: minestorm.msg
  vanish:
    description: Toggle vanish mode
    usage: /vanish [player]
    aliases: [ v ]
    permission: minestorm.vanish

permissions:
  minestorm.gamemode: { description: Use gamemode commands on self, default: op }
  minestorm.gamemode.others: { description: Change others' gamemode, default: op }
  minestorm.fly: { description: Toggle flight, default: op }
  minestorm.fly.others: { description: Toggle flight for others, default: op }
  minestorm.flyspeed: { description: Set own fly speed, default: op }
  minestorm.flyspeed.others: { description: Set others' fly speed, default: op }
  minestorm.msg: { description: Send private messages, default: true }
  minestorm.msg.color: { description: Use color codes, default: op }
  minestorm.msg.spy: { description: Social spy, default: op }
  minestorm.vanish: { description: Toggle vanish, default: op }
  minestorm.vanish.others: { description: Vanish others, default: op }
  minestorm.vanish.see: { description: See vanished players, default: op }
  minestorm.*:
    description: All permissions
    default: op
    children:
      minestorm.gamemode: true
      minestorm.gamemode.others: true
      minestorm.fly: true
      minestorm.fly.others: true
      minestorm.flyspeed: true
      minestorm.flyspeed.others: true
      minestorm.msg: true
      minestorm.msg.color: true
      minestorm.msg.spy: true
      minestorm.vanish: true
      minestorm.vanish.others: true
      minestorm.vanish.see: true
